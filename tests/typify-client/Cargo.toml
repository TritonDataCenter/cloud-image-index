[package]
name = "cloud-image-index-typify-client"
version = "0.1.0"
edition.workspace = true
description = "Client types generated by typify from the published OpenAPI document, to test how generated clients cope with the index evolving"
license = "MPL-2.0"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
# Generated code validates string patterns with regress, as in any
# typify- or progenitor-generated client.
regress = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
api = { package = "cloud-image-index-api", path = "../../apis/cloud-image-index-api" }
schemars = { workspace = true }
serde_json = { workspace = true }
typify = { workspace = true }
