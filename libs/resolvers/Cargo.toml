[package]
name = "cloud-image-index-resolvers"
version = "0.1.0"
edition.workspace = true
description = "Per-vendor discovery of upstream cloud images: list releases and resolve them to concrete images and checksums"
license = "MPL-2.0"

[lints]
workspace = true

[lib]
name = "resolvers"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync"] }
url = { workspace = true }
