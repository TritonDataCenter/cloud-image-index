#
# Cross-compile the SmartOS client for illumos and keep the binary as a
# workflow artifact. Builds use `cross`, whose x86_64-unknown-illumos
# container image holds the illumos sysroot and a GCC toolchain for any
# C code in dependencies. The image cannot run illumos binaries, so this
# is a compile-and-link check; tests run in ci.yml on Linux.
#
# A version tag (v0.9.0) also publishes that binary as a GitHub release,
# with SHA256SUMS and install.sh for the one-line install.

name: illumos

on:
  pull_request:
  push:
    branches: [main]
    # A tag push ignores paths-ignore, so every version tag builds.
    tags: ["v*"]
    # The index workflow's own commits only touch site/.
    paths-ignore:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illumos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-illumos
  BINARY: cloud-image
  # cross v0.2.5 (2023-02-04) is the latest release. GitHub publishes no
  # checksum for its assets, so this SHA-256 is of the asset as first
  # downloaded on 2026-10-08.
  CROSS_URL: https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
  CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
  # gh, for publishing releases: the self-hosted runners do not promise
  # one. The SHA-256 is from the release's gh_2.102.0_checksums.txt.
  GH_VERSION: 2.102.0
  GH_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386

defaults:
  run:
    shell: bash

jobs:
  build:
    # As in ci.yml: pushes, manual runs and pull requests from branches in
    # this repository use the self-hosted triton runners; pull requests
    # from forks stay on GitHub-hosted runners, since this repository is
    # public and a fork's code must not run on self-hosted machines. cross
    # needs Docker on whichever runner picks the job up.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"triton","labels":["self-hosted","APP"]}') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cross
        run: |
          curl -sSfL -o cross.tar.gz "$CROSS_URL"
          echo "$CROSS_SHA256  cross.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf cross.tar.gz -C "$HOME/.local/bin" cross
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Install the toolchain rust-toolchain.toml names, and rustup first if
      # the runner lacks it: the self-hosted runners are shared and their
      # Rust setup is not ours to rely on. No cache (we chose not to cache),
      # and warnings stay warnings (the action's default would deny them in
      # every later build).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: warn
          # cross builds with this toolchain, so it needs the target's
          # standard library.
          target: ${{ env.TARGET }}
      # The man pages carry the date of the commit being built (for a pull
      # request, the merge commit GitHub made). cross runs rustc in a
      # container, so the variable has to be passed through to it.
      - name: Date the build by its commit
        run: echo "CLOUD_IMAGE_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      - name: Build
        env:
          CROSS_BUILD_ENV_PASSTHROUGH: CLOUD_IMAGE_DATE
        run: cross build --release --locked --target "$TARGET" -p "$BINARY"
      - name: Show what was built
        run: |
          bin="target/$TARGET/release/$BINARY"
          file "$bin"
          readelf -h "$bin" | grep -E 'Class|Machine|OS/ABI'
          readelf -d "$bin" | grep NEEDED
          file "$bin" | grep 'ELF 64-bit LSB .*x86-64' > /dev/null
          # The date reached the build inside cross's container.
          grep -aF "$CLOUD_IMAGE_DATE" "$bin" > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY }}-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/${{ env.BINARY }}
          if-no-files-found: error

  release:
    # Publishes the binary the build job made, for a version tag only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Tags are pushed from this repository, never a fork.
    runs-on:
      group: triton
      labels: [self-hosted, APP]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gh
        run: |
          name="gh_${GH_VERSION}_linux_amd64"
          curl -sSfL -o gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/$name.tar.gz"
          echo "$GH_SHA256  gh.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gh.tar.gz --strip-components=2 -C "$HOME/.local/bin" "$name/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH applies from the next step on.
          "$HOME/.local/bin/gh" --version
      - name: Check the tag names the crate's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tools/cloud-image/Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME, but tools/cloud-image/Cargo.toml says $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BINARY }}-${{ env.TARGET }}
          path: artifact
      - name: Gather the release files
        run: |
          mkdir dist
          cp "artifact/$BINARY" "dist/$BINARY-$TARGET"
          cp tools/cloud-image/install.sh dist/install.sh
          (cd dist && sha256sum "$BINARY-$TARGET" > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install or update in a SmartOS global zone:

          \`\`\`
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | CLOUD_IMAGE_RELEASE=$GITHUB_REF_NAME bash
          \`\`\`

          The latest release is always:

          \`\`\`
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | bash
          \`\`\`"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "cloud-image $GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes \
            --verify-tag
