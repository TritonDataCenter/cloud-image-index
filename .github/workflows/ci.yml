#
# Check formatting, lints, tests and docs on every pull request and on pushes
# to main. The tests include the tree checks on examples/, so an API
# change fails here until examples/v1/openapi.json is refreshed.
#
# site/ is not checked here: after an API change it holds the previous
# version's v1/openapi.json until the next index run rewrites it, and
# the index workflow validates the tree it writes.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    # The index workflow's own commits only touch site/.
    paths-ignore:
      - "site/**"

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Pushes and pull requests from branches in this repository run on
    # the self-hosted triton runners. Pull requests from forks stay on
    # GitHub-hosted runners: this repository is public, and a fork's code
    # must not run on self-hosted machines.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('{"group":"triton","labels":["self-hosted","APP"]}') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install the toolchain rust-toolchain.toml names, and rustup first if
      # the runner lacks it: the self-hosted runners are shared and their
      # Rust setup is not ours to rely on. No cache (we chose not to cache).
      # Here every warning is an error, so code quality cannot slip; the
      # index and illumos builds keep warnings as warnings, so a new
      # toolchain lint cannot stop the daily index or a release build.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: deny
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Broken doc links and doc syntax are not compiler warnings, so clippy
      # does not catch them.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
