[workspace]
members = [
    "apis/cloud-image-index-api",
    "libs/client",
    "libs/resolvers",
    "tools/generate",
    "tools/cloud-image",
    "tests/typify-client",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
regress = "0.12.0"
# rustls with the ring provider, installed by each binary before it builds a
# client: ring cross-compiles to illumos with a plain C compiler, unlike the
# default aws-lc provider.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std", "tls12"] }
# Writes cloud-image's man page, generated on the user's machine from the
# clap definitions.
roff = "1.1.1"
sha2 = "0.11.0"
tokio = { version = "1.53.2" }
typify = "0.8.0"
url = "2.5.8"
# Mozilla's root certificates, for binaries that cannot rely on a system
# CA store (SmartOS has none rustls can find).
webpki-root-certs = "1.0.9"
uuid = { version = "1.27.0", features = ["v5"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dropshot = { version = "0.17.1" }
# The response type of raw (non-JSON) dropshot endpoints.
http = "1.5.0"
# Builds SmartOS images from NoCloud cloud images, from monitor-reef (added
# there in TritonDataCenter/monitor-reef#35). Pinned to a commit on its main
# branch.
nocloud-import = { git = "https://github.com/TritonDataCenter/monitor-reef", rev = "329f17db29c0f45b74b10d1542b775defbd16c7d" }
openapiv3 = "2.2.0"
progenitor = "0.15.0"
progenitor-client = "0.15.0"
# dropshot 0.17 is built on schemars 0.8; schemars 1.x is not compatible.
schemars = { version = "0.8.22", features = ["chrono", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
