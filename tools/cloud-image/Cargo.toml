[package]
name = "cloud-image"
version = "0.9.0"
edition.workspace = true
description = "Import images listed in the cloud-image-index into SmartOS"
license = "MPL-2.0"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
client = { package = "cloud-image-index-client", path = "../../libs/client" }
nocloud-import = { workspace = true }
resolvers = { package = "cloud-image-index-resolvers", path = "../../libs/resolvers" }
clap = { workspace = true }
reqwest = { workspace = true }
roff = { workspace = true }
semver = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }
uuid = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
