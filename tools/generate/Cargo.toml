[package]
name = "cloud-image-index-generate"
version = "0.1.0"
edition.workspace = true
description = "Query vendors with the resolvers and write the cloud-image-index file tree"
license = "MPL-2.0"

[lints]
workspace = true

[lib]
name = "generate"

[[bin]]
name = "cloud-image-index-generate"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
api = { package = "cloud-image-index-api", path = "../../apis/cloud-image-index-api" }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
resolvers = { package = "cloud-image-index-resolvers", path = "../../libs/resolvers" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
url = { workspace = true }
